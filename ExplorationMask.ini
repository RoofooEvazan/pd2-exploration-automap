; PD2 Exploration Automap BETA. Settings are read when the game starts.
; hybrid   = modern outlined walls/shorelines with native details and icons
; native   = original artwork with exploration shading and the reveal edge
; styled   = simplified floors/walls with exploration (previous appearance)
; original = the game's normal automap without the exploration effect
; Original symbols/artwork are preserved in native and hybrid modes. No new markers/arrows.
[Automap]
CampaignStyle=hybrid
MapsStyle=styled
; Custom full-screen overlay opacity, 10-100 percent; 100 restores the previous look.
; The tested D2GL corner map uses fixed capture opacity. Native icons are unchanged.
OverlayOpacity=80
