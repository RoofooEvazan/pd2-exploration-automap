; Menu selections save immediately. Manual edits require a restart.
; Reveal radius is fixed in the plugin at 33 world subtiles.

; Styles: original, native, hybrid, styled.
; original = native artwork/discovery; neutral white fullscreen walls are dimmed
; native = original artwork with exploration clipping and a colored boundary
; hybrid = contours and shaded floors with native details
; styled = contour terrain with recognized navigation artwork
; Colors: red, yellow, green, cyan, magenta, white.
; BoundaryThickness: 0.5, 1.0, 1.5 or 2.0; changes width only.
; Automap Fade affects fullscreen walls, water and floors, not the boundary.
; Legacy StylizationOpacity and OverlayOpacity keys are ignored.
[Maps]
Style=styled
BoundaryColor=cyan
WallColor=white
WaterColor=white
BoundaryThickness=1.0

[Campaign]
Style=hybrid
BoundaryColor=cyan
WallColor=white
WaterColor=white
BoundaryThickness=1.0
