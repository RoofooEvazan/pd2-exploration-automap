; PD2 Exploration Automap BETA. Menu choices save immediately.
; MapStyle native = the original game automap without custom rendering.
; hybrid = modern contours with native terrain details and navigation artwork.
; styled = contours with navigation artwork; ordinary terrain sprites are removed.
; Towns stay native. No new quest markers or exit arrows.
[Automap]
; Applies to campaign and maps. Also available in Automap Options.
MapStyle=hybrid
; Custom full-screen overlay opacity, 10-100 percent; 100 restores the previous look.
; The tested D2GL corner map uses fixed capture opacity. Native icons are unchanged.
OverlayOpacity=80
; Reveal distance is fixed in the plugin; this file controls appearance only.
; Also available in the supported game's existing Automap Options menu.
; red, neon-green, magenta, cyan, light-blue, orange, pale-blue, pale-yellow,
; pale-green, pale-peach, pale-lemon, gray, white. Menu selections save immediately.
BoundaryColor=red
; Independent modern wall/shoreline color; gray preserves the previous appearance.
; Native artwork, icons, floor shading, and water fill keep their own colors.
WallColor=gray
