; PD2 Exploration Automap. Menu selections save immediately.
[Automap]
; Applies to campaign and endgame maps: native, hybrid or styled.
; native = original game rendering; hybrid = contours plus native details;
; styled = contour terrain with recognized navigation artwork.
MapStyle=hybrid
; Custom fullscreen alpha scale, 10-100%. Corner-map capture opacity is fixed.
OverlayOpacity=80
; Color keys for both settings:
; red, neon-green, magenta, cyan, light-blue, orange, pale-blue, pale-yellow,
; pale-green, pale-peach, pale-lemon, gray, white.
BoundaryColor=red
WallColor=gray
; Reveal radius is compiled into the plugin; there is no distance setting.
